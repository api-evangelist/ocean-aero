aid: ocean-aero
name: Ocean Aero
description: >-
  Ocean Aero is a Gulfport, Mississippi maritime robotics manufacturer that designs, builds and
  operates the Triton, an environmentally powered Autonomous Underwater and Surface Vehicle (AUSV)
  that can both sail on the surface and submerge to collect data above and below the waterline and
  relay it back to shore. The 14-foot platform harvests wind and solar energy, carries pre-packaged
  or custom payloads for defense, ocean research and offshore energy missions, and is managed
  through Ocean Aero's own proprietary mission-control GUI with fleet-wide waypoint and payload
  management. As of this profile Ocean Aero sells vehicles, payloads and mission services — it
  publishes no public developer program, no API reference and no machine-readable API contract.
